<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAF4E8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Les Voisins du 13" />
<title>Les Voisins du 13 · Rue des Carrières, Montmagny</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#FAF4E8; --cream-deep:#F1E7D3; --card:#FFFFFF;
    --ink:#2E2A24; --ink-soft:#7A7167;
    --terracotta:#C15F2E; --terracotta-soft:#F3DDCB; --coral:#E07A4D;
    --leaf:#2F6B50; --leaf-soft:#DCEBE0;
    --border:#ECE3D2; --shadow:0 1px 0 rgba(0,0,0,.04);
    --maxw:430px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    background:var(--cream);color:var(--ink);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overscroll-behavior-y:none;
  }
  h1,h2,h3,.display{font-family:"Fraunces",Georgia,serif;letter-spacing:-.01em;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  img{display:block;max-width:100%;}

  /* App is a centered phone column */
  .phone{
    position:relative;max-width:var(--maxw);margin:0 auto;min-height:100dvh;
    background:var(--cream);
    background-image:radial-gradient(circle at 1px 1px, rgba(193,95,46,.05) 1px, transparent 0);
    background-size:22px 22px;
    box-shadow:0 0 60px rgba(0,0,0,.06);
    display:flex;flex-direction:column;
  }

  /* ===== Onboarding ===== */
  #onboard{
    position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:32px 28px;
    background:radial-gradient(120% 80% at 50% 0%, #FBEEDD 0%, var(--cream) 55%);
    text-align:center;transition:opacity .5s ease, transform .5s ease;
  }
  #onboard.hide{opacity:0;transform:scale(1.04);pointer-events:none;}
  .ob-badge{
    width:84px;height:84px;border-radius:26px;display:grid;place-items:center;
    background:linear-gradient(140deg,var(--terracotta),var(--coral));color:#fff;
    box-shadow:0 14px 30px -8px rgba(193,95,46,.55);margin-bottom:22px;
    font-family:"Fraunces",serif;font-size:40px;font-weight:600;
  }
  #onboard .eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--terracotta);}
  #onboard h1{font-size:30px;line-height:1.1;margin:10px 0 6px;font-weight:600;}
  #onboard p.sub{color:var(--ink-soft);font-size:15px;max-width:300px;margin:0 0 30px;line-height:1.5;}
  .ob-field{width:100%;max-width:330px;}
  .ob-field label{display:block;text-align:left;font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 8px 4px;}
  .ob-field input{
    width:100%;padding:16px 18px;border-radius:18px;border:1.5px solid var(--border);
    background:#fff;font-size:17px;color:var(--ink);outline:none;transition:border .2s,box-shadow .2s;
  }
  .ob-field input:focus{border-color:var(--terracotta);box-shadow:0 0 0 4px rgba(193,95,46,.12);}
  .ob-btn{
    margin-top:16px;width:100%;max-width:330px;padding:16px;border-radius:18px;
    background:var(--terracotta);color:#fff;font-size:16px;font-weight:600;
    box-shadow:0 10px 20px -8px rgba(193,95,46,.6);transition:transform .12s, opacity .2s;
  }
  .ob-btn:active{transform:scale(.97);}
  .ob-foot{margin-top:26px;font-size:12px;color:var(--ink-soft);opacity:.8;}

  /* ===== Header ===== */
  .hdr{
    position:sticky;top:0;z-index:30;padding:calc(var(--safe-top) + 12px) 18px 12px;
    background:rgba(250,244,232,.82);backdrop-filter:saturate(180%) blur(18px);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
    border-bottom:1px solid rgba(236,227,210,.7);
  }
  .hdr-row{display:flex;align-items:center;gap:12px;}
  .hdr-logo{
    width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;
    background:linear-gradient(140deg,var(--terracotta),var(--coral));color:#fff;
    font-family:"Fraunces",serif;font-weight:600;font-size:20px;
    box-shadow:0 6px 14px -6px rgba(193,95,46,.6);
  }
  .hdr-titles{flex:1;min-width:0;}
  .hdr-titles .t{font-family:"Fraunces",serif;font-weight:600;font-size:18px;line-height:1.1;}
  .hdr-titles .s{font-size:12px;color:var(--ink-soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hdr-bell{
    width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:#fff;border:1px solid var(--border);color:var(--terracotta);position:relative;
  }
  .hdr-bell .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:2px solid #fff;}
  .greet{margin-top:14px;}
  .greet .hi{font-family:"Fraunces",serif;font-size:24px;font-weight:600;line-height:1.05;}
  .greet .hi span{color:var(--terracotta);}
  .greet .day{font-size:13px;color:var(--ink-soft);margin-top:2px;}

  /* ===== Scroll area ===== */
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(96px + var(--safe-bot));}
  .page{display:none;animation:fade .35s ease;}
  .page.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .page-head{margin:4px 2px 16px;}
  .page-head .eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--terracotta);}
  .page-head h2{font-size:27px;font-weight:600;margin:4px 0 0;line-height:1.05;}
  .page-head p{font-size:14px;color:var(--ink-soft);margin:6px 0 0;line-height:1.45;}

  .section-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:22px 4px 10px;}

  /* ===== Cards ===== */
  .card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);border:1px solid rgba(236,227,210,.6);overflow:hidden;margin-bottom:14px;}
  .card-pad{padding:16px;}
  .post-head{display:flex;align-items:center;gap:11px;margin-bottom:11px;}
  .avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;font-size:16px;font-family:"Fraunces",serif;}
  .avatar.ring{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--terracotta-soft);}
  .post-meta{flex:1;min-width:0;}
  .post-meta .nm{font-weight:600;font-size:14.5px;line-height:1.15;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .post-meta .sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.02em;}
  .chip.mairie{background:var(--leaf-soft);color:var(--leaf);}
  .chip.pin{background:var(--terracotta-soft);color:var(--terracotta);}
  .pin-flag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--terracotta);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}

  .post-title{font-family:"Fraunces",serif;font-size:19px;font-weight:600;line-height:1.18;margin:2px 0 6px;}
  .post-body{font-size:14.5px;line-height:1.5;color:#433d35;}
  .post-media{margin:12px -16px 0;}
  .post-media img{width:100%;height:auto;object-fit:cover;}
  .media-stack{display:flex;gap:2px;}
  .media-stack img{width:50%;height:160px;object-fit:cover;}
  /* ===== Carrousel média (façon Instagram) ===== */
  .carousel-wrap{margin:12px -16px 0;}
  .carousel{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 16px;}
  .carousel::-webkit-scrollbar{display:none;}
  .slide{position:relative;flex:0 0 84%;scroll-snap-align:center;aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:#15130f;}
  .slide:last-child{margin-right:0;}
  .slide-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(22px) brightness(.55);transform:scale(1.25);}
  .slide-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;}
  .slide-count{position:absolute;top:10px;right:12px;z-index:3;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;backdrop-filter:blur(4px);}
  .slide.video video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;background:#000;}
  .vid-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.94);color:var(--terracotta);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4);padding-left:3px;z-index:2;transition:opacity .2s;}
  .vid-label{position:absolute;left:12px;bottom:12px;z-index:2;display:flex;align-items:center;gap:7px;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6);transition:opacity .2s;}
  .vid-dot{width:8px;height:8px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 0 0 rgba(255,77,77,.6);animation:rec 1.6s infinite;}
  @keyframes rec{0%{box-shadow:0 0 0 0 rgba(255,77,77,.6);}70%{box-shadow:0 0 0 7px rgba(255,77,77,0);}100%{box-shadow:0 0 0 0 rgba(255,77,77,0);}}
  .dots{display:flex;justify-content:center;gap:6px;margin-top:10px;}
  .dots .d{width:6px;height:6px;border-radius:50%;background:var(--border);transition:.25s;}
  .dots .d.on{background:var(--terracotta);width:18px;border-radius:3px;}
  /* lightbox */
  #light{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:16px;flex-direction:column;}
  #light.show{display:flex;animation:fade .25s ease;}
  #light .lx-close{position:absolute;top:calc(var(--safe-top) + 14px);right:18px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:20px;display:grid;place-items:center;z-index:2;}
  #light .lx-title{position:absolute;top:calc(var(--safe-top) + 20px);left:20px;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;}
  #light video,#light img{max-width:100%;max-height:82vh;border-radius:14px;}

  .info-row{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#433d35;margin-top:9px;}
  .info-row svg{flex:none;color:var(--terracotta);}

  /* reactions */
  .react-bar{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid var(--border);}
  .react{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-soft);padding:7px 12px;border-radius:999px;background:var(--cream-deep);transition:transform .12s,background .2s,color .2s;}
  .react:active{transform:scale(.92);}
  .react.on{background:var(--terracotta-soft);color:var(--terracotta);}
  .react.coming.on{background:var(--leaf-soft);color:var(--leaf);}
  .react .ic{font-size:15px;line-height:1;}
  .react-spacer{flex:1;}
  .react-share{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--leaf);}

  .coming-faces{display:flex;align-items:center;margin-top:12px;}
  .coming-faces .fc{width:26px;height:26px;border-radius:50%;border:2px solid #fff;margin-left:-8px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:600;}
  .coming-faces .fc:first-child{margin-left:0;}
  .coming-faces .lbl{font-size:12px;color:var(--ink-soft);margin-left:10px;}

  /* special cards */
  .mini{display:flex;align-items:center;gap:12px;padding:14px 16px;}
  .mini .ic{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:20px;}
  .mini .tx{flex:1;min-width:0;}
  .mini .tx .a{font-weight:600;font-size:14px;line-height:1.2;}
  .mini .tx .b{font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.35;}
  .card.tint-leaf{background:linear-gradient(135deg,#EAF3EC,#fff 70%);}
  .card.tint-coral{background:linear-gradient(135deg,#FBEAE0,#fff 70%);}
  .card.tint-terra{background:linear-gradient(135deg,#F7E6D8,#fff 70%);}

  .thanks-card{background:linear-gradient(135deg,#F6ECD9,#fff 80%);}

  /* facts grid */
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
  .fact{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid rgba(236,227,210,.6);border-radius:18px;padding:13px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow);}
  .fact .ic{font-size:20px;}

  /* filter pills */
  .pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -2px 4px;scrollbar-width:none;}
  .pills::-webkit-scrollbar{display:none;}
  .pill{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px;background:var(--cream-deep);color:var(--ink-soft);transition:.2s;}
  .pill.on{background:var(--terracotta);color:#fff;}

  /* action buttons (bottom of entre-voisins) */
  .act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid rgba(236,227,210,.7);border-radius:18px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .12s,background .2s;}
  .act:active{transform:scale(.98);}
  .act .ic{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:18px;}
  .act .lbl{flex:1;font-size:14px;font-weight:600;}
  .act .plus{color:var(--ink-soft);font-size:18px;font-weight:700;}

  /* profile */
  .prof-card{border-radius:26px;padding:20px;color:#fff;background:linear-gradient(140deg,var(--terracotta),var(--coral));box-shadow:0 16px 30px -14px rgba(193,95,46,.6);margin-bottom:8px;}
  .prof-top{display:flex;align-items:center;gap:15px;}
  .prof-top .av{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-family:"Fraunces",serif;font-size:26px;font-weight:600;box-shadow:0 0 0 3px rgba(255,255,255,.3);}
  .prof-top .meta{flex:1;min-width:0;}
  .prof-top .meta .since{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85;}
  .prof-top .meta .nm{font-family:"Fraunces",serif;font-size:23px;font-weight:600;line-height:1.1;margin-top:1px;}
  .prof-top .meta .loc{font-size:13px;opacity:.9;margin-top:1px;}
  .prof-edit{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:16px;flex:none;}
  .prof-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
  .prof-stats .st{background:rgba(255,255,255,.16);border-radius:16px;padding:10px 6px;text-align:center;}
  .prof-stats .st .v{font-family:"Fraunces",serif;font-size:19px;font-weight:600;line-height:1;}
  .prof-stats .st .l{font-size:10px;opacity:.85;margin-top:3px;}

  .list{background:#fff;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(236,227,210,.6);}
  .li{display:flex;align-items:center;gap:12px;padding:13px 15px;border-top:1px solid rgba(236,227,210,.7);}
  .li:first-child{border-top:none;}
  .li .ic{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--cream-deep);color:var(--terracotta);font-size:17px;}
  .li .tx{flex:1;min-width:0;}
  .li .tx .a{font-size:14px;font-weight:600;}
  .li .tx .b{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .li .ca{color:var(--ink-soft);font-size:15px;}
  .li .badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf);}

  .mypost{padding:14px 15px;border-top:1px solid rgba(236,227,210,.7);}
  .mypost:first-child{border-top:none;}
  .mypost .a{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;}
  .mypost .meta{font-size:12px;color:var(--ink-soft);margin-top:4px;display:flex;align-items:center;gap:6px;}
  .mypost .meta .ok{color:var(--leaf);font-weight:600;}
  .mypost .pushrow{display:flex;align-items:center;gap:8px;margin-top:11px;}
  .mypost .pushbtn{font-size:12px;font-weight:600;color:var(--terracotta);background:var(--terracotta-soft);padding:7px 12px;border-radius:999px;transition:transform .12s;}
  .mypost .pushbtn:active{transform:scale(.95);}
  .mypost .stat{font-size:11.5px;color:var(--ink-soft);}

  .signout{margin:14px 0 6px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:999px;padding:13px;font-size:14px;font-weight:600;color:var(--ink-soft);}
  .foot{text-align:center;font-size:11px;color:var(--ink-soft);opacity:.85;padding:10px 0 4px;}

  /* ===== Bottom nav ===== */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:var(--maxw);margin:0 auto;
    padding:8px 10px calc(8px + var(--safe-bot));
    background:rgba(250,244,232,.86);backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:1px solid rgba(236,227,210,.7);
    display:flex;justify-content:space-around;
  }
  .nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 14px;color:var(--ink-soft);transition:color .2s;flex:1;}
  .nav-btn.on{color:var(--terracotta);}
  .nav-btn .lab{font-size:10.5px;font-weight:600;}
  .nav-btn svg{transition:transform .2s;}
  .nav-btn.on svg{transform:translateY(-1px);}

  /* toast */
  #toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-bot));transform:translateX(-50%) translateY(20px);z-index:70;
    background:var(--ink);color:#fff;font-size:13px;font-weight:500;padding:11px 18px;border-radius:999px;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.4);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:88%;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(min-width:500px){ .phone{border-left:1px solid var(--border);border-right:1px solid var(--border);} }
</style>
</head>
<body>

<!-- ============ ONBOARDING ============ -->
<div id="onboard">
  <div class="ob-badge">13</div>
  <div class="eyebrow">Rue des Carrières · Montmagny</div>
  <h1>Les Voisins du 13</h1>
  <p class="sub">Le fil vivant de notre résidence.<br>Entraide, sorties et infos pratiques,<br>entre voisins.</p>
  <form class="ob-field" id="obForm" autocomplete="off">
    <label for="obName">Comment tu t'appelles&nbsp;?</label>
    <input id="obName" type="text" placeholder="Ton prénom" autocomplete="given-name" />
    <button class="ob-btn" type="submit">Entrer dans le quartier</button>
  </form>
  <div class="ob-foot">Aucune inscription. Juste un coup d'œil chaleureux.</div>
</div>

<!-- ============ APP ============ -->
<div class="phone" id="app" style="display:none">
  <!-- Header -->
  <header class="hdr">
    <div class="hdr-row">
      <div class="hdr-logo">13</div>
      <div class="hdr-titles">
        <div class="t">Les Voisins du 13</div>
        <div class="s">Rue des Carrières · Montmagny</div>
      </div>
      <button class="hdr-bell" onclick="toast('3 nouvelles publications cette semaine')" aria-label="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="dot"></span>
      </button>
    </div>
    <div class="greet">
      <div class="hi">Bonjour <span id="greetName">voisin</span> 👋</div>
      <div class="day" id="greetDay">Ravi de te voir rue des Carrières</div>
    </div>
  </header>

  <main id="scroll">

const reactState={};
function reactBar(id,base,helpMode){
  reactState[id]=reactState[id]||{like:base.like,liked:false,coming:base.coming,joined:false};
  const s=reactState[id];
  const comingBtn = helpMode ? "" :
    `<button class="react coming ${s.joined?'on':''}" data-r="${id}" data-k="coming"><span class="ic">${s.joined?'✅':'🙋'}</span><span class="n">${s.coming}</span> viennent</button>`;
  return `<div class="react-bar">
    <button class="react ${s.liked?'on':''}" data-r="${id}" data-k="like"><span class="ic">${s.liked?'❤️':'🤍'}</span><span class="n">${s.like}</span></button>
    ${comingBtn}
    <span class="react-spacer"></span>
    <button class="react-share" onclick="shareToast(event)">↗ Partager</button>
  </div>`;
}
function bindReacts(scope){
  scope.querySelectorAll('.react[data-r]').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.r,k=btn.dataset.k,s=reactState[id];
      if(k==='like'){s.liked=!s.liked;s.like+=s.liked?1:-1;btn.querySelector('.ic').textContent=s.liked?'❤️':'🤍';btn.querySelector('.n').textContent=s.like;btn.classList.toggle('on',s.liked);if(s.liked)pop(btn);}
      if(k==='coming'){s.joined=!s.joined;s.coming+=s.joined?1:-1;btn.querySelector('.ic').textContent=s.joined?'✅':'🙋';btn.querySelector('.n').textContent=s.coming;btn.classList.toggle('on',s.joined);if(s.joined){toast('Tu es noté comme participant 🎉');pop(btn);}}
    };
  });
}
function pop(el){el.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:280,easing:'ease-out'});}
function shareToast(e){e.stopPropagation();toast('Lien copié — prêt à partager sur WhatsApp 💬');}

/* ============ NAV / STATE ============ */
function go(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  document.getElementById('scroll').scrollTo({top:0,behavior:'instant'});
  if(navigator.vibrate)navigator.vibrate(4);
}
function getName(){return localStorage.getItem('voisin_name')||ME_DEFAULT;}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function applyName(){
  const n=getName();
  document.getElementById('greetName').textContent=n===ME_DEFAULT?'voisin':escapeHtml(n);
  const days=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  document.getElementById('greetDay').textContent="Nous sommes "+days[new Date().getDay()]+", belle journée rue des Carrières";
}
function startApp(){
  document.getElementById('onboard').classList.add('hide');
  setTimeout(()=>{document.getElementById('onboard').style.display='none';},500);
  document.getElementById('app').style.display='flex';
  applyName();
  renderFil();renderResidence();renderVoisins();renderProfil();
}
function changeName(){
  localStorage.removeItem('voisin_name');
  document.getElementById('onboard').style.display='flex';
  document.getElementById('onboard').classList.remove('hide');
  document.getElementById('app').style.display='none';
  document.getElementById('obName').value='';
  document.getElementById('obName').focus();
}

/* ============ CARROUSEL ============ */
function syncDots(carId){
  const car=document.getElementById(carId);
  const dots=document.getElementById('dots-'+carId.split('-')[1]);
  if(!car||!dots)return;
  const center=car.scrollLeft+car.clientWidth/2;
  let idx=0,best=1e9;
  [...car.children].forEach((s,i)=>{const c=s.offsetLeft+s.offsetWidth/2;const d=Math.abs(c-center);if(d<best){best=d;idx=i;}});
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===idx));
}
function playInline(btn){
  const slide=btn.closest('.slide');
  const v=slide.querySelector('video');
  v.setAttribute('controls','');
  v.play();
  btn.style.opacity='0';btn.style.pointerEvents='none';
  const lbl=slide.querySelector('.vid-label');if(lbl)lbl.style.opacity='0';
  v.addEventListener('pause',()=>{if(v.currentTime>0&&!v.ended){/* garde controls */}});
  if(navigator.vibrate)navigator.vibrate(6);
}

/* ============ LIGHTBOX ============ */
function openVideo(src,title){
  const l=document.getElementById('light');
  document.getElementById('lxTitle').innerHTML='<span class="vid-dot"></span>'+title;
  document.getElementById('lxBody').innerHTML='<video src="'+src+'" controls autoplay playsinline></video>';
  l.classList.add('show');
  if(navigator.vibrate)navigator.vibrate(6);
}
function openImage(src){
  const l=document.getElementById('light');
  document.getElementById('lxTitle').textContent='';
  document.getElementById('lxBody').innerHTML='<img src="'+src+'" alt=""/>';
  l.classList.add('show');
}
function closeLight(e){
  if(e && e.target.closest('#lxBody')) return; // ne ferme pas si on clique la vidéo
  const l=document.getElementById('light');
  l.classList.remove('show');
  document.getElementById('lxBody').innerHTML=''; // stoppe la lecture
}

/* ============ TOAST ============ */
let toastT;
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============ BOOT ============ */
document.getElementById('obForm').addEventListener('submit',e=>{
  e.preventDefault();
  const v=document.getElementById('obName').value.trim();
  if(!v){document.getElementById('obName').focus();return;}
  localStorage.setItem('voisin_name',v);
  startApp();
});
window.addEventListener('load',()=>{
  if(getName()!==ME_DEFAULT){startApp();}
  else{setTimeout(()=>document.getElementById('obName').focus(),300);}
});
</script>
</body>
